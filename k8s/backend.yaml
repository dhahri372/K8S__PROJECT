apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: 192.168.56.20:5000/mon-app-backend:v37 
        ports:
        - containerPort: 5000
        env:
        - name: DB_NAME      
          value: "k8s_db"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort 
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 32001